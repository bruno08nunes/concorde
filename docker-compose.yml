services:
    postgres:
        image: postgres:18
        container_name: concorde-postgres

        restart: unless-stopped

        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: concorde

        ports:
            - "5432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql/data

    mongo:
        image: mongo:8
        container_name: concorde-mongo

        restart: unless-stopped

        volumes:
            - mongo_data:/data/db

volumes:
    postgres_data:
    mongo_data: